/* Концепт: мягкое приложение привычек. Тёмная градиентная шапка с одометром и кольцом, полоса дней, крупные карточки, плавающая панель вкладок. */
:root {
  --bg: #F3F4F8;
  --surface: #FFFFFF;
  --surface2: #EBEDF3;
  --ink: #14161F;
  --muted: #666B7C;
  --line: #E1E4EC;
  --line2: #C3C8D4;
  --accent: #E8503A;
  --accent-ink: #FFFFFF;
  --ok: #138A5B;
  --signal: #A5610A;
  --hero-a: #1A2850;
  --hero-b: #0E6B66;
  --hero-ink: #FFFFFF;
  --tabbg: rgba(255,255,255,.86);
  --shadow: 0 1px 2px rgba(20,22,31,.05), 0 8px 22px rgba(20,22,31,.06);
  --font-display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0D14; --surface: #151823; --surface2: #1F2331; --ink: #F2F3F8; --muted: #9AA0B4;
    --line: #262A3A; --line2: #3A4055; --accent: #FF7A59; --accent-ink: #1C0A05; --ok: #52D69A; --signal: #F0B33C;
    --hero-a: #1B2A5A; --hero-b: #0D6E6A; --tabbg: rgba(21,24,35,.88);
    --shadow: 0 0 0 1px #262A3A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0D14; --surface: #151823; --surface2: #1F2331; --ink: #F2F3F8; --muted: #9AA0B4;
  --line: #262A3A; --line2: #3A4055; --accent: #FF7A59; --accent-ink: #1C0A05; --ok: #52D69A; --signal: #F0B33C;
  --hero-a: #1B2A5A; --hero-b: #0D6E6A; --tabbg: rgba(21,24,35,.88);
  --shadow: 0 0 0 1px #262A3A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--font-body);
  padding-block: 18px 128px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-weight: 800; font-size: 24px; line-height: 1.2; letter-spacing: -0.02em; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 800; }
p { margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* шапка */
.hero {
  position: relative; overflow: hidden; color: var(--hero-ink);
  background: linear-gradient(140deg, var(--hero-a) 0%, var(--hero-b) 100%);
  border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 16px;
}
.hero::after {
  content: ""; position: absolute; right: -50px; top: -60px; width: 190px; height: 190px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.18), transparent 66%); pointer-events: none;
}
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: relative; z-index: 1; }
.hero-label { font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; opacity: .85; }
.hchip { font-size: 13px; font-weight: 800; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.16); white-space: nowrap; }
.hero-main { display: flex; align-items: center; justify-content: space-between; gap: 14px; position: relative; z-index: 1; }
.digits { display: flex; align-items: center; gap: 6px; min-width: 0; }
.dg {
  font-family: var(--font-display); font-weight: 600; font-size: 40px; line-height: 1;
  background: rgba(255,255,255,.14); border-radius: 14px; padding: 12px 11px 10px; font-variant-numeric: tabular-nums;
}
.digits .unit { font-weight: 800; margin-left: 8px; font-size: 15px; opacity: .85; }
.ring { position: relative; width: 74px; height: 74px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4.5; }
.ring .rt { stroke: rgba(255,255,255,.22); }
.ring .rf { stroke: var(--hero-ink); stroke-linecap: round; }
@media (prefers-reduced-motion: no-preference) { .ring .rf { transition: stroke-dashoffset .35s ease; } }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }

.chip {
  display: inline-flex; align-items: center; font-size: 13px; font-weight: 800; padding: 5px 12px; border-radius: 999px;
  background: var(--surface2); color: var(--ink); font-variant-numeric: tabular-nums;
}
.chip.accent { background: var(--accent); color: var(--accent-ink); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }

.card { background: var(--surface); box-shadow: var(--shadow); border-radius: 22px; padding: 18px; }
.card.flat { border-radius: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* полоса дней */
.days { position: relative; display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px; scrollbar-width: none; scroll-snap-type: x proximity; }
.days::-webkit-scrollbar { display: none; }
.dchip {
  flex: none; width: 54px; height: 70px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  text-decoration: none; color: var(--ink); position: relative; scroll-snap-align: center;
}
.dchip small { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.dchip b { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
.dchip.on { background: var(--accent); color: var(--accent-ink); }
.dchip.on small { color: inherit; opacity: .85; }
.dchip.done::after { content: ""; position: absolute; bottom: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.dchip.on.done::after { background: var(--accent-ink); }
.daytitle { display: flex; flex-direction: column; gap: 6px; }
.daytitle .date { font-size: 13px; color: var(--muted); font-weight: 700; text-transform: capitalize; }

/* задачи */
.tasks { display: flex; flex-direction: column; gap: 10px; }
.task {
  display: flex; gap: 14px; align-items: flex-start; padding: 16px; min-height: 68px;
  background: var(--surface); box-shadow: var(--shadow); border-radius: 20px; cursor: pointer;
}
.task input {
  -webkit-appearance: none; appearance: none; flex: none; margin: 2px 0 0; width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--line2); background: transparent; display: grid; place-items: center; cursor: pointer;
}
.task input:checked { background: var(--accent); border-color: var(--accent); }
.task input:checked::after { content: ""; width: 7px; height: 13px; border: solid var(--accent-ink); border-width: 0 3px 3px 0; transform: translateY(-1px) rotate(45deg); }
.task .txt { min-width: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.task .tag { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, currentColor 14%, transparent); }
.tag.v { color: var(--accent); } .tag.s { color: var(--signal); } .tag.g { color: var(--ok); } .tag.m { color: var(--muted); }
.task .body { overflow-wrap: anywhere; font-weight: 600; }
.task.done { opacity: .6; }
.task.done .body { text-decoration: line-through; }

/* карточки видео */
.vidlink {
  display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink);
  padding: 12px 14px 12px 12px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); min-height: 76px;
}
.vidlink .vn {
  flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--hero-ink);
  background: linear-gradient(140deg, var(--hero-a), var(--hero-b));
}
.vidlink.k1 .vn { background: linear-gradient(140deg, #E8503A, #F59E0B); }
.vidlink.k2 .vn { background: linear-gradient(140deg, #0E6B66, #22A6A0); }
.vidlink .t { min-width: 0; flex: 1; }
.vidlink .t b { display: block; font-weight: 800; overflow-wrap: anywhere; line-height: 1.3; }
.vidlink .t span { font-size: 13px; color: var(--muted); font-weight: 600; }
.vidlink .go { color: var(--muted); font-size: 22px; }
.dots { display: flex; gap: 4px; flex: none; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--surface2); box-shadow: inset 0 0 0 1px var(--line2); }
.dots i.on { background: var(--ok); box-shadow: none; }

/* страница видео */
.back { text-decoration: none; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; min-height: 36px; }
.statuses { display: flex; flex-wrap: wrap; gap: 8px; }
.statuses label {
  display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 16px;
  background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; font-weight: 700; font-size: 14px; cursor: pointer;
}
.statuses input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.sec h3 { margin-bottom: 10px; }
.hook { font-size: 20px; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; letter-spacing: -0.01em; }
.script { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.script li { display: grid; grid-template-columns: 62px 1fr; gap: 10px; }
.script .tc { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 4px; font-weight: 500; }
.script .tx { overflow-wrap: anywhere; min-width: 0; }
.list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.list li { overflow-wrap: anywhere; }
.btn {
  min-height: 48px; padding: 0 20px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-ink);
  font: 800 15px var(--font-body); cursor: pointer; margin-top: 14px;
}
.btn.ghost { background: var(--surface2); color: var(--ink); }
.coverbox {
  border-radius: 18px; padding: 18px; color: var(--hero-ink);
  background: linear-gradient(140deg, var(--hero-a), var(--hero-b));
}
.coverbox .big { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1.15; margin-bottom: 8px; overflow-wrap: anywhere; }
.coverbox .muted { color: inherit; opacity: .85; }
details.card summary { cursor: pointer; font-weight: 800; min-height: 32px; display: flex; align-items: center; }
details.card[open] summary { margin-bottom: 12px; }

/* прогресс */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); box-shadow: var(--shadow); border-radius: 20px; padding: 14px 12px; min-width: 0; }
.stat b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 700; }
.phase { display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.phase:first-of-type { border-top: 0; padding-top: 4px; }
.phase .pd { font-size: 12px; color: var(--muted); width: 92px; flex: none; padding-top: 3px; font-weight: 700; }
.phase .pn { font-weight: 800; }
.phase.now .pn { color: var(--accent); }
.viewrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.viewrow:first-of-type { border-top: 0; }
.viewrow .vt { flex: 1; min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
.viewrow input {
  width: 100px; min-height: 46px; border-radius: 14px; border: 0; background: var(--surface2); color: var(--ink);
  font: 700 16px var(--font-body); padding: 0 12px; text-align: right;
}

/* панель вкладок */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));

nav.tabs .in {
  pointer-events: auto; max-width: 420px; margin: 0 auto; padding: 6px; border-radius: 28px;
  background: var(--tabbg); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  box-shadow: 0 8px 28px rgba(0,0,0,.18), 0 0 0 1px var(--line);

}
nav.tabs a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px;
  text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 800; border-radius: 22px;
}
nav.tabs a svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs a.on { background: var(--accent); color: var(--accent-ink); }
@media (max-width: 380px) { .dg { font-size: 32px; padding: 10px 9px 8px; } .script li { grid-template-columns: 52px 1fr; } .ring { width: 64px; height: 64px; } }
</style>

</head>

    var tasks = d.tasks.map(function (t, i) {
      var id = n + '-' + i, on = !!state.checks[id];
      return '<label class="task' + (on ? ' done' : '') + '"><input type="checkbox" data-task="' + id + '"' + (on ? ' checked' : '') + '><span class="txt"><span class="tag ' + t[0] + '">' + TAGS[t[0]] + '</span><span class="body">' + esc(t[1]) + '</span></span></label>';
    }).join('');
    var vids = d.vids.length ? '<div class="stack"><h3>Видео этого дня</h3>' + d.vids.map(function (id) { return vidLink(videoById(id)); }).join('') + '</div>' : '';
    var over = cur > PLAN_DAYS && n === PLAN_DAYS ? '<div class="card flat small">План на 14 дней закончился. Вернись в чат и попроси следующие 14 дней: я подстрою их под твои цифры.</div>' : '';
    return hero(n) + '<div class="days" id="days">' + strip + '</div>' +
      '<div class="daytitle"><div class="date">' + dateLabel(n) + '</div><h2>' + esc(d.t) + '</h2><div class="meta">' + chips + '</div></div>' +
      '<div class="tasks">' + tasks + '</div>' + vids + over;
  }

  function viewVideos() {
    return '<div class="stack"><h2>Видео</h2><p class="muted small">Восемь роликов на первые 14 дней. Внутри каждого: текст, кадры, обложка, монтаж, описание.</p></div>' +
      '<div class="stack">' + VIDEOS.map(vidLink).join('') + '</div>' +
      '<details class="card"><summary>Шаблон монтажа для любого видео</summary><ol class="list">' + MONTAGE_BASE.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ol></details>';
  }

  function viewVideo(id) {
    var v = videoById(id);
    if (!v) return viewVideos();
    var s = vs(id);
    function st(key, label) { return '<label><input type="checkbox" data-vs="' + id + ':' + key + '"' + (s[key] ? ' checked' : '') + '>' + label + '</label>'; }
    return '<a class="back" href="#videos">‹ Все видео</a>' +
      '<div class="stack"><h2>V' + v.id + '. ' + esc(v.title) + '</h2>' +
      '<div class="meta"><span class="chip">' + esc(v.fmt) + '</span><span class="chip">день ' + v.post + ', ' + v.time + '</span><span class="chip">' + v.len + '</span></div></div>' +
      '<div class="statuses">' + st('shot', 'Снято') + st('edit', 'Смонтировано') + st('posted', 'Опубликовано') + '</div>' +
      '<div class="card sec"><h3>Идея</h3><p>' + esc(v.idea) + '</p></div>' +
      '<div class="card sec"><h3>Хук, первые 3 секунды</h3><p class="hook">' + esc(v.hook) + '</p></div>' +
      '<div class="card sec"><h3>Что говорить</h3><ol class="script" id="sc-' + id + '">' + v.script.map(function (l) { return '<li><span class="tc">' + l[0] + '</span><span class="tx">' + esc(l[1]) + '</span></li>'; }).join('') + '</ol><button class="btn ghost" type="button" data-copy="' + id + '">Скопировать текст</button></div>' +
      '<div class="card sec"><h3>Кадры и ракурсы</h3><ul class="list">' + v.shots.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
      '<div class="card sec"><h3>Обложка</h3><div class="coverbox"><div class="big">' + esc(v.cover.text) + '</div><p class="small muted">' + esc(v.cover.frame) + '</p></div></div>' +
      '<div class="card sec"><h3>Монтаж</h3><ul class="list">' + v.montage.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '<li>Остальное по шаблону: <a href="#videos">общий список шагов</a>.</li></ul></div>' +
      '<div class="card sec"><h3>Описание и теги</h3><p>' + esc(v.caption) + '</p><p class="muted small" style="margin-top:8px">' + esc(v.tags) + '</p></div>' +
      '<div class="card sec"><h3>Публикация</h3><p>День ' + v.post + ' (' + dateLabel(v.post) + '), в ' + v.time + '. Выкладывай одновременно в TikTok, Reels и Shorts. Время 20:00 и 22:00 чередуются специально: так увидим, какое работает лучше.</p></div>';
  }

  function viewProgress() {
    var cur = planDay(), totalTasks = DAYS.reduce(function (a, d) { return a + d.tasks.length; }, 0), doneTasks = 0;
    DAYS.forEach(function (d, di) { d.tasks.forEach(function (_, i) { if (state.checks[(di + 1) + '-' + i]) doneTasks++; }); });
    var posted = VIDEOS.filter(function (v) { return vs(v.id).posted; }).length;
    var today = todayUTC();
    var phases = PHASES.map(function (p) {
      var now = today >= p.from && today <= p.to;
      return '<div class="phase' + (now ? ' now' : '') + '"><span class="pd">' + p.d + '</span><div><div class="pn">' + p.name + (now ? ' · сейчас' : '') + '</div><p class="small muted">' + p.text + '</p></div></div>';
    }).join('');
    var sum = 0, best = null;
    VIDEOS.forEach(function (v) { var n = Number(state.views[v.id]); if (n > 0) { sum += n; if (!best || n > Number(state.views[best.id])) best = v; } });
    var rows = VIDEOS.map(function (v) {
      var val = state.views[v.id] != null && state.views[v.id] !== '' ? state.views[v.id] : '';
      return '<div class="viewrow"><span class="vt"><b>V' + v.id + '</b> ' + esc(v.title) + '</span><input type="number" inputmode="numeric" min="0" id="views-' + v.id + '" data-views="' + v.id + '" value="' + val + '" placeholder="0" aria-label="Просмотры V' + v.id + '"></div>';
    }).join('');
    return '<h2>Прогресс</h2>' + hero(null) +
      '<div class="stats"><div class="stat"><b>' + streak() + '</b><span>дней подряд</span></div><div class="stat"><b>' + doneTasks + '/' + totalTasks + '</b><span>задач</span></div><div class="stat"><b>' + posted + '/' + VIDEOS.length + '</b><span>видео</span></div></div>' +
      '<div class="card"><h3 style="margin-bottom:6px">Этапы до 01.03.2027</h3>' + phases + '</div>' +
      '<div class="card"><h3 style="margin-bottom:6px">Просмотры по видео</h3>' + rows +
      '<p class="small muted" style="margin-top:10px" id="viewsum">' + (sum ? 'Всего: ' + sum.toLocaleString('ru-RU') + '. Лучшее: V' + best.id + '.' : 'Введи цифры из TikTok, и здесь появится лучшее видео.') + '</p></div>' +
      '<p class="small muted">Цель в 1000 долларов это ориентир, а не прогноз. Сейчас главное: каждый день выпускать видео и смотреть на цифры.</p>';
  }

  var app = document.getElementById('app'), tabs = document.getElementById('tabs');
  var ICONS = {
    today: '<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>',
    videos: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>',
    progress: '<svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/></svg>'
  };

  function render() {
    var h = location.hash.slice(1), m, tab = 'today', html;
    if ((m = h.match(/^day-(\d+)$/))) html = viewToday(clampDay(parseInt(m[1], 10)));
    else if ((m = h.match(/^video-(\d+)$/))) { tab = 'videos'; html = viewVideo(parseInt(m[1], 10)); }
    else if (h === 'videos') { tab = 'videos'; html = viewVideos(); }
    else if (h === 'progress') { tab = 'progress'; html = viewProgress(); }
    else html = viewToday(clampDay(planDay()));
    app.innerHTML = html;
    var dcs = document.getElementById('days'), sel = dcs && dcs.querySelector('.on');
    if (sel) dcs.scrollLeft = sel.offsetLeft - (dcs.clientWidth - sel.offsetWidth) / 2;
    var cur = clampDay(planDay());
    tabs.innerHTML = [['today', '#day-' + cur, 'Сегодня'], ['videos', '#videos', 'Видео'], ['progress', '#progress', 'Прогресс']].map(function (t) {
      return '<a href="' + t[1] + '" class="' + (t[0] === tab ? 'on' : '') + '"' + (t[0] === tab ? ' aria-current="page"' : '') + '>' + ICONS[t[0]] + t[2] + '</a>';
    }).join('');
  }

  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('input[data-task]')) {
      var key = t.getAttribute('data-task');
      if (t.checked) state.checks[key] = 1; else delete state.checks[key];
      save();
      t.closest('.task').classList.toggle('done', t.checked);
      var n = parseInt(key.split('-')[0], 10), total = DAYS[n - 1].tasks.length, done = dayCount(n);
      var rf = document.getElementById('ringfill'); if (rf) rf.setAttribute('stroke-dashoffset', (113.1 * (1 - done / total)).toFixed(1));
      var rt = document.getElementById('ringtxt'); if (rt) rt.textContent = done + '/' + total;
      var dcc = document.getElementById('dc-' + n); if (dcc) dcc.classList.toggle('done', done === total);
    } else if (t.matches('input[data-vs]')) {
      var p = t.getAttribute('data-vs').split(':');
      state.vstat[p[0]] = state.vstat[p[0]] || {};
      state.vstat[p[0]][p[1]] = t.checked;
      save();
    } else if (t.matches('input[data-views]')) {
      var id = t.getAttribute('data-views');
      if (t.value === '') delete state.views[id]; else state.views[id] = Math.max(0, parseInt(t.value, 10) || 0);
      save();
      render();
    }
  });

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]');
    if (!b) return;
    var id = parseInt(b.getAttribute('data-copy'), 10), v = videoById(id);
    var text = v.script.map(function (l) { return l[1]; }).join('\n');
    function fallback() {
      var el = document.getElementById('sc-' + id), r = document.createRange();
      r.selectNodeContents(el);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      b.textContent = 'Выделено, нажми «Копировать»';
    }
    try {
      navigator.clipboard.writeText(text).then(function () { b.textContent = 'Скопировано'; }, fallback);
    } catch (err) { fallback(); }
  });

  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });
  render();
})();
</script>

</body>
</html>
